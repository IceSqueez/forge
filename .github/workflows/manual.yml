name: Manual

on:
  workflow_dispatch:
    inputs:
      os:
        description: Target OS
        required: true
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      command:
        description: Command to run
        required: true
        type: choice
        options:
          - test
          - clippy
          - build-release

permissions:
  contents: read

jobs:
  manual:
    name: manual (${{ inputs.os }}, ${{ inputs.command }})
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust with cache
        uses: ./.github/actions/setup-rust-cached

      - name: Run test
        if: inputs.command == 'test'
        shell: bash
        run: cargo test --workspace

      - name: Run clippy
        if: inputs.command == 'clippy'
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run build-release
        if: inputs.command == 'build-release'
        env:
          # Compile-time Twitch client_id from repo secret. Empty if secret unset → app falls back to runtime env var or shows UX error.
          FORGE_TWITCH_CLIENT_ID: ${{ secrets.FORGE_TWITCH_CLIENT_ID }}
          FORGE_YOUTUBE_CLIENT_ID: ${{ secrets.FORGE_YOUTUBE_CLIENT_ID }}
          FORGE_YOUTUBE_CLIENT_SECRET: ${{ secrets.FORGE_YOUTUBE_CLIENT_SECRET }}
        shell: bash
        run: cargo build --workspace --release

      - name: Upload artifacts
        if: inputs.command == 'build-release'
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ inputs.os }}
          path: target/release/forge${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
