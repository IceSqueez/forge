forge-server          = { path = "../forge-server" }
forge-widgets        = { path = "../forge-widgets" }
iced                = { workspace = true }
rfd                 = { workspace = true }
open                = { workspace = true }
serde_json          = { workspace = true }
thiserror           = { workspace = true }
time                = { workspace = true }
