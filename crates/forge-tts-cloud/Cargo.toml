[package]
name = "forge-tts-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
azure = ["dep:serde_json"]
elevenlabs = ["dep:serde_json"]
openai = ["dep:serde_json"]
polly = ["dep:serde_json", "dep:hmac", "dep:sha2", "dep:time"]

[dependencies]
forge-speech-types = { path = "../forge-speech-types" }
forge-tts-core = { path = "../forge-tts-core" }
forge-audio = { path = "../forge-audio" }
forge-net = { path = "../forge-net" }
forge-types = { path = "../forge-types" }
async-trait = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }
serde_json = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
time = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
reqwest = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
