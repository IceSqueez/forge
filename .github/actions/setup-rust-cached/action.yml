name: Setup Rust with cache
description: Install toolchain from rust-toolchain.toml. Cache is provided by setup-rust-toolchain itself. On Linux runners, installs libasound2-dev (required by cpal via alsa-sys).

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt,clippy
