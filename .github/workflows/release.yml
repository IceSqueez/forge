name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No `test` job here: tags are cut from `main`, where CI has already
  # validated `cargo test --workspace --locked`. Re-running the test suite
  # would burn ~5 min/release for zero added signal.
  build:
    name: Build
    uses: ./.github/workflows/_build-matrix.yml
    with:
      package_name: forge-desktop
      bin_name: forge
      retention_days: 1

  publish:
    name: Publish
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: |
          for f in *; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done

      - name: Resolve previous tag
        id: prev_tag
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            echo "range=$PREV.." >> $GITHUB_OUTPUT
          else
            echo "range=" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ steps.prev_tag.outputs.range }}HEAD --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Fallback changelog
        if: hashFiles('RELEASE_NOTES.md') == '' || steps.cliff.outcome == 'failure'
        run: |
          {
            echo "## What's Changed"
            echo ""
            git log ${{ steps.prev_tag.outputs.range }}HEAD --oneline --no-merges \
              | grep -v "^.*chore: Release" \
              | grep -v "^.*docs(changelog)" \
              | sed 's/^[a-f0-9]* /- /'
          } > RELEASE_NOTES.md

      - name: Append download table
        shell: bash
        run: |
          set -euo pipefail

          classify() {
            case "$1" in
              *macos-universal.dmg)  echo "macOS (Apple Silicon + Intel)" ;;
              *windows-x64.msi)      echo "Windows x64 (installer)" ;;
              *windows-x64.exe)      echo "Windows x64 (portable)" ;;
              *linux-x64.AppImage)   echo "Linux x64 (AppImage, portable)" ;;
              *linux-x64.deb)        echo "Linux x64 (Debian / Ubuntu)" ;;
              *linux-x64.rpm)        echo "Linux x64 (Fedora / RHEL / openSUSE)" ;;
              *)                     echo "" ;;
            esac
          }

          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"

          {
            echo ""
            echo "## Downloads"
            echo ""
            echo "| File | Platform | Checksum |"
            echo "| :--- | :--- | :--- |"
            # Fixed order: Linux (portable → deb → rpm) → macOS → Windows (installer → portable)
            for ext in AppImage deb rpm dmg msi exe; do
              for f in artifacts/*."$ext"; do
                [ -f "$f" ] || continue
                name="$(basename "$f")"
                platform="$(classify "$name")"
                [ -z "$platform" ] && continue
                echo "| [\`$name\`](https://github.com/$REPO/releases/download/$TAG/$name) | $platform | [checksum](https://github.com/$REPO/releases/download/$TAG/$name.sha256) |"
              done
            done
            echo ""
            echo "_Each binary ships with a matching \`<file>.sha256\` sidecar for offline verification._"
          } >> RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
