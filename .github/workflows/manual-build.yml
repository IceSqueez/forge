name: Manual Build

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Artifact retention (days)"
        required: false
        default: "7"
        type: string

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/_test-matrix.yml

  build:
    name: Build
    needs: [checks]
    uses: ./.github/workflows/_build-matrix.yml
    secrets: inherit
    with:
      package_name: forge-desktop
      bin_name: forge
      retention_days: ${{ fromJSON(inputs.retention_days) }}
