[package]
name = "forge-app"
description = "Forge — streaming automation toolkit with event-driven actions across Twitch/YouTube/Trovo/Kick + multi-engine TTS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[lib]
name = "forge_app"
path = "src/lib.rs"

[dependencies]
forge-types = { path = "../forge-types" }
forge-events = { path = "../forge-events" }
forge-runtime = { path = "../forge-runtime" }
forge-script = { path = "../forge-script" }
forge-storage = { path = "../forge-storage" }
forge-storage-sqlite = { path = "../forge-storage-sqlite" }
forge-platform-core = { path = "../forge-platform-core" }
forge-obs = { path = "../forge-obs" }
forge-vtube = { path = "../forge-vtube" }
forge-discord = { path = "../forge-discord" }
forge-midi = { path = "../forge-midi" }
forge-hotkey = { path = "../forge-hotkey" }
forge-platform-twitch = { path = "../forge-platform-twitch" }
forge-platform-youtube = { path = "../forge-platform-youtube" }
forge-platform-trovo = { path = "../forge-platform-trovo" }
forge-platform-kick = { path = "../forge-platform-kick" }
async-trait = { workspace = true }
reqwest = { workspace = true }
forge-audio = { path = "../forge-audio" }
forge-server = { path = "../forge-server" }
forge-soundboard = { path = "../forge-soundboard" }
forge-speak-queue = { path = "../forge-speak-queue" }
forge-tts-core = { path = "../forge-tts-core" }
forge-tts-piper = { path = "../forge-tts-piper" }
forge-tts-espeak = { path = "../forge-tts-espeak" }
forge-tts-sapi = { path = "../forge-tts-sapi" }
forge-tts-nsspeech = { path = "../forge-tts-nsspeech" }
forge-tts-cloud = { path = "../forge-tts-cloud", features = [
  "azure",
  "elevenlabs",
  "openai",
  "polly",
] }
forge-tts-pipeline = { path = "../forge-tts-pipeline" }
forge-voice = { path = "../forge-voice" }
forge-registry = { path = "../forge-registry" }
forge-widgets = { path = "../forge-widgets" }
iced = { workspace = true }
fluent = { workspace = true }
fluent-langneg = { workspace = true }
unic-langid = { workspace = true }
sys-locale = { workspace = true }
rfd = { workspace = true }
open = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }

[package.metadata.wix]
eula = false

[package.metadata.deb]
name = "forge"
maintainer = "IceSqueez <icesqueez@gmail.com>"
copyright = "2026, IceSqueez"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = "Cross-platform desktop tool combining event-driven automation across Twitch / YouTube / Trovo / Kick / OBS / Discord / etc. with multi-engine TTS, voice aliases, queues, and message preprocessing."
section = "sound"
priority = "optional"
depends = "libc6, libwayland-client0, libxkbcommon0, libgl1, libasound2, libdbus-1-3"
assets = [
  ["target/release/forge", "usr/bin/forge", "755"],
  ["../../assets/forge.desktop", "usr/share/applications/forge.desktop", "644"],
  ["../../assets/icon-16.png",  "usr/share/icons/hicolor/16x16/apps/forge.png",   "644"],
  ["../../assets/icon-32.png",  "usr/share/icons/hicolor/32x32/apps/forge.png",   "644"],
  ["../../assets/icon-48.png",  "usr/share/icons/hicolor/48x48/apps/forge.png",   "644"],
  ["../../assets/icon-64.png",  "usr/share/icons/hicolor/64x64/apps/forge.png",   "644"],
  ["../../assets/icon-128.png", "usr/share/icons/hicolor/128x128/apps/forge.png", "644"],
  ["../../assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/forge.png", "644"],
  ["../../assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/forge.png", "644"],
]

[package.metadata.generate-rpm]
name = "forge"
license = "MIT OR Apache-2.0"
summary = "Streaming automation toolkit with multi-engine TTS"
requires = { "libwayland-client" = "*", "libxkbcommon" = "*", "mesa-libGL" = "*", "alsa-lib" = "*", "dbus-libs" = "*" }
assets = [
  { source = "target/release/forge", dest = "/usr/bin/forge", mode = "755" },
  { source = "../../assets/forge.desktop", dest = "/usr/share/applications/forge.desktop", mode = "644" },
  { source = "../../assets/icon-16.png",  dest = "/usr/share/icons/hicolor/16x16/apps/forge.png",   mode = "644" },
  { source = "../../assets/icon-32.png",  dest = "/usr/share/icons/hicolor/32x32/apps/forge.png",   mode = "644" },
  { source = "../../assets/icon-48.png",  dest = "/usr/share/icons/hicolor/48x48/apps/forge.png",   mode = "644" },
  { source = "../../assets/icon-64.png",  dest = "/usr/share/icons/hicolor/64x64/apps/forge.png",   mode = "644" },
  { source = "../../assets/icon-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/forge.png", mode = "644" },
  { source = "../../assets/icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/forge.png", mode = "644" },
  { source = "../../assets/icon-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/forge.png", mode = "644" },
]
