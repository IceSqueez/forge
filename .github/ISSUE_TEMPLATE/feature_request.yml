name: Feature request
description: Suggest an idea or enhancement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Forge aims to stay focused - please help us understand the use case before we discuss design.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What can't you do today, or what's painful?
      placeholder: As a streamer doing X, I currently have to ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you want Forge to handle this?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools / workarounds you've tried, and why they fall short.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: |
        Forge is intentionally minimal. Help us scope: is this a core capability, or a plugin/script that builds on existing primitives?
      options:
        - label: I believe this needs core changes (event types, runtime, schema)
        - label: This could be built on top of existing rhai scripting + actions
        - label: I'm not sure
  - type: checkboxes
    id: confirmations
    attributes:
      label: Pre-submission checks
      options:
        - label: I've searched existing issues and discussions
          required: true
