name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.gitattributes'
      - 'cliff.toml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.gitattributes'
      - 'cliff.toml'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    name: lint
    if: "${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && startsWith(github.event.head_commit.message, 'chore(release): ')) }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: HTTP client boundary
        shell: bash
        run: python3 .github/scripts/http-client-boundary.py

      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Doc
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  emulator:
    name: emulator
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EMULATOR_MANIFEST: tools/forge-emulator/Cargo.toml
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: emulator-${{ runner.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        shell: bash
        run: cargo fmt --manifest-path "$EMULATOR_MANIFEST" -- --check

      - name: Clippy
        shell: bash
        run: cargo clippy --manifest-path "$EMULATOR_MANIFEST" --all-targets --locked -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --manifest-path "$EMULATOR_MANIFEST" --locked

  test:
    name: test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Test
        shell: bash
        run: cargo test --workspace --locked
