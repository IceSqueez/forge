[workspace]
resolver = "3"
members = [
  "crates/forge-types",
  "crates/forge-events",
  "crates/forge-registry",
  "crates/forge-runtime",
  "crates/forge-script",
  "crates/forge-storage",
  "crates/forge-storage-sqlite",
  "crates/forge-platform-core",
  "crates/forge-platform-twitch",
  "crates/forge-platform-youtube",
  "crates/forge-platform-trovo",
  "crates/forge-platform-kick",
  "crates/forge-obs",
  "crates/forge-server",
  "crates/forge-audio",
  "crates/forge-soundboard",
  "crates/forge-tts-core",
  "crates/forge-voice",
  "crates/forge-tts-pipeline",
  "crates/forge-tts-piper",
  "crates/forge-tts-espeak",
  "crates/forge-speak-queue",
  "crates/forge-widgets",
  "crates/forge-app",
]
default-members = ["crates/forge-app"]

[workspace.package]
version = "0.1.0-beta.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IceSqueez/forge"
rust-version = "1.96"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7" }
futures-core = { version = "0.3" }
futures-util = { version = "0.3" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

thiserror = { version = "2" }

async-trait = { version = "0.1" }

time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

ulid = { version = "1", features = ["serde"] }

tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = { version = "0.2" }

sqlx = { version = "0.9", features = [
  "sqlite",
  "runtime-tokio",
  "migrate",
  "time",
] }

aes-gcm = { version = "0.10" }
directories = { version = "6" }
keyring = { version = "4" }
keyring-core = { version = "1" }
rand = { version = "0.10" }
tempfile = { version = "3" }
mockall = { version = "0.13" }

sha2 = { version = "0.11" }
base64 = { version = "0.22" }
subtle = { version = "2" }
arc-swap = { version = "1" }

rhai = { version = "1", features = ["sync"] }

reqwest = { version = "0.12", features = [
  "json",
  "rustls-tls",
], default-features = false }

twitch_api = { version = "0.7", features = [
  "reqwest",
  "helix",
], default-features = false }

axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

iced = { version = "0.14", features = [
  "tokio",
  "image",
  "svg",
  "advanced",
  "canvas",
  "lazy",
] }
iced_fonts = { version = "0.3", features = ["bootstrap"] }

rfd = { version = "0.17", default-features = false, features = [
  "xdg-portal",
  "wayland",
] }
open = { version = "5" }

cpal = { version = "0.17" }
rubato = { version = "3.0" }
regex = { version = "1" }
once_cell = { version = "1" }
symphonia = { version = "0.6", features = ["all-codecs", "all-formats"] }
crossbeam-channel = { version = "0.5" }
futures = { version = "0.3" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "debuginfo"
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]

# System libraries required by cpal (forge-audio) on Linux.
[workspace.metadata.dist.dependencies.apt]
libasound2-dev = '*'
