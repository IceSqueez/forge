[workspace]
resolver = "3"
members = [
  "crates/forge-types",
  "crates/forge-events",
  "crates/forge-registry",
  "crates/forge-runtime",
  "crates/forge-script",
  "crates/forge-storage",
  "crates/forge-storage-sqlite",
  "crates/forge-platform-core",
  "crates/forge-platform-twitch",
  "crates/forge-platform-youtube",
  "crates/forge-platform-kick",
  "crates/forge-obs",
  "crates/forge-vtube",
  "crates/forge-discord",
  "crates/forge-midi",
  "crates/forge-hotkey",
  "crates/forge-server",
  "crates/forge-audio",
  "crates/forge-soundboard",
  "crates/forge-tts-core",
  "crates/forge-voice",
  "crates/forge-tts-pipeline",
  "crates/forge-tts-piper",
  "crates/forge-tts-espeak",
  "crates/forge-tts-sapi",
  "crates/forge-tts-nsspeech",
  "crates/forge-tts-cloud",
  "crates/forge-speak-queue",
  "crates/forge-widgets",
  "crates/forge-app",
]
default-members = ["crates/forge-app"]

[workspace.package]
version = "0.2.0-beta.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IceSqueez/forge"
rust-version = "1.96"

[workspace.dependencies]
tokio = { version = "1.52", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7" }
futures-core = { version = "0.3" }
futures-util = { version = "0.3" }

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

thiserror = { version = "2.0" }

async-trait = { version = "0.1" }

time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

ulid = { version = "1.2", features = ["serde"] }

tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = { version = "0.2" }

sqlx = { version = "0.9", features = [
  "sqlite",
  "runtime-tokio",
  "migrate",
  "time",
] }

aes-gcm = { version = "0.11" }
directories = { version = "6.0" }
rand = { version = "0.10" }
tempfile = { version = "3.27" }
mockall = { version = "0.15" }
wiremock = { version = "0.6" }

sha2 = { version = "0.11" }
base64 = { version = "0.22" }
subtle = { version = "2.6" }
arc-swap = { version = "1.9" }

rhai = { version = "1.25", features = ["sync"] }

midir = { version = "0.11" }

global-hotkey = { version = "0.8" }
zbus = { version = "5.17", default-features = false, features = ["tokio"] }
libc = { version = "0.2" }

reqwest = { version = "0.13", features = [
  "json",
  "rustls",
  "query",
  "form",
  "multipart",
], default-features = false }

twitch_api = { version = "0.8", features = [
  "reqwest",
  "helix",
], default-features = false }

obws = { version = "0.15", features = ["events"] }

windows = { version = "0.62", features = [
  "Win32_Media_Speech",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_Foundation",
  "Win32_Media_Audio",
] }

hmac = { version = "0.13" }

objc2 = { version = "0.6" }
objc2-foundation = { version = "0.3", features = ["NSRunLoop", "NSDate"] }
objc2-avf-audio = { version = "0.3", features = [
  "AVSpeechSynthesis",
  "AVAudioBuffer",
  "AVAudioFormat",
  "AVAudioTypes",
  "block2",
] }
block2 = { version = "0.6" }

axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors", "fs"] }

iced = { version = "0.14", features = [
  "tokio",
  "image",
  "svg",
  "advanced",
  "canvas",
  "lazy",
] }
iced_fonts = { version = "0.3", features = ["bootstrap"] }
fontdb = "0.23"

rfd = { version = "0.17", default-features = false, features = [
  "xdg-portal",
  "wayland",
] }
open = { version = "5.3" }
arboard = { version = "3.6", default-features = false, features = [
  "wayland-data-control",
] }
notify-rust = { version = "4.18" }

cpal = { version = "0.18" }
rubato = { version = "4.0" }
regex = { version = "1.13" }
once_cell = { version = "1.21" }
symphonia = { version = "0.6", features = ["all-codecs", "all-formats"] }
crossbeam-channel = { version = "0.5" }
futures = { version = "0.3" }

fluent = { version = "0.17" }
fluent-langneg = { version = "0.13" }
unic-langid = { version = "0.9" }
sys-locale = { version = "0.3" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "debuginfo"
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
