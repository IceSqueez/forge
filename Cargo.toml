[workspace]
resolver = "3"
members = [
  "crates/forge-types",
  "crates/forge-events",
  "crates/forge-runtime",
  "crates/forge-script",
  "crates/forge-storage",
  "crates/forge-storage-sqlite",
  "crates/forge-platform-core",
  "crates/forge-platform-twitch",
  "crates/forge-server",
  "crates/forge-widgets",
  "crates/forge-app",
]
default-members = ["crates/forge-app"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IceSqueez/forge"
rust-version = "1.95"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

thiserror = { version = "2" }

async-trait = { version = "0.1" }

time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

ulid = { version = "1", features = ["serde"] }

tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

sqlx = { version = "0.8", features = [
  "sqlite",
  "runtime-tokio",
  "migrate",
  "time",
] }

aes-gcm = { version = "0.10" }
keyring = { version = "4" }
keyring-core = { version = "1" }
rand = { version = "0.10" }
tempfile = { version = "3" }

rhai = { version = "1", features = ["sync"] }

reqwest = { version = "0.13", features = [
  "json",
  "form",
  "rustls",
], default-features = false }

axum = { version = "0.8" }

iced = { version = "0.14", features = ["tokio", "image", "svg", "advanced"] }
iced_fonts = { version = "0.3" }

cpal = { version = "0.17" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "debuginfo"
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.metadata.dist]
cargo-dist-version = "0.21.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
pr-run-mode = "plan"
