name: Feature request
description: Suggest an idea or enhancement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Forge aims to stay focused - please help us understand the use case before we discuss design.
  - type: dropdown
    id: area
    attributes:
      label: Which part of Forge?
      options:
        - Chat and platforms (Twitch, YouTube, Kick)
        - Actions, triggers and scripts
        - Overlays and alerts
        - Text-to-speech and voices
        - Soundboard and audio
        - OBS, VTube Studio or Discord
        - Donations
        - Backups, packs and import
        - Installation and updates
        - Something else or not sure
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What can't you do today, or what's painful?
      placeholder: As a streamer doing X, I currently have to ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you want Forge to handle this? A rough idea is fine.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you've tried, and why they fall short.
  - type: dropdown
    id: platforms
    attributes:
      label: Which platforms do you need this on?
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Pre-submission checks
      options:
        - label: I've searched existing issues and discussions
          required: true
