name: Setup Rust with cache
description: Install toolchain from rust-toolchain.toml. Cache is shared across dev workflows via shared-key=dev-<os> so pr/nightly/manual reuse each other's target/debug/ rather than rebuilding cold. On Linux runners, installs the gpui + cpal system libraries needed to build and link forge-desktop.

inputs:
  shared-key:
    description: "Cache key shared across workflows. Default `dev-<os>` lets pr/nightly/manual reuse target/debug/ across workflow boundaries."
    required: false
    default: dev-${{ runner.os }}
  save-if:
    description: "Whether to save a new cache entry after this run. Set to 'false' on workflows that should READ the cache but not write new entries (e.g. pull-request runs and manual workflow_dispatch runs that would otherwise bloat storage with per-PR or per-run caches)."
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev libx11-dev \
          libasound2-dev libdbus-1-dev libfontconfig1-dev pkg-config

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt,clippy
        cache-shared-key: ${{ inputs.shared-key }}
        cache-on-failure: 'false'
        cache-save-if: ${{ inputs.save-if }}
