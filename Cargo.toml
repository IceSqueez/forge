[workspace]
resolver = "3"
members = [
  "crates/forge-types",
  "crates/forge-events",
  "crates/forge-runtime",
  "crates/forge-script",
  "crates/forge-storage",
  "crates/forge-storage-sqlite",
  "crates/forge-platform-core",
  "crates/forge-platform-twitch",
  "crates/forge-obs",
  "crates/forge-server",
  "crates/forge-widgets",
  "crates/forge-app",
]
default-members = ["crates/forge-app"]

[workspace.package]
version = "0.1.0-alpha.8"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IceSqueez/forge"
rust-version = "1.95"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.29" }
futures-core = { version = "0.3" }
futures-util = { version = "0.3" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

thiserror = { version = "2" }

async-trait = { version = "0.1" }

time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

ulid = { version = "1", features = ["serde"] }

tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

sqlx = { version = "0.8", features = [
  "sqlite",
  "runtime-tokio",
  "migrate",
  "time",
] }

aes-gcm = { version = "0.10" }
directories = { version = "5" }
keyring = { version = "4" }
keyring-core = { version = "1" }
rand = { version = "0.10" }
tempfile = { version = "3" }

sha2 = { version = "0.10" }

rhai = { version = "1", features = ["sync"] }

reqwest = { version = "0.13", features = [
  "json",
  "form",
  "rustls",
], default-features = false }

axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

iced = { version = "0.14", features = ["tokio", "image", "svg", "advanced"] }
iced_fonts = { version = "0.3", features = ["bootstrap"] }

rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }

cpal = { version = "0.17" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "debuginfo"
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Allow manual edits to release.yml without dist refusing to run.
# Two intentional deltas vs dist init template:
#   1. `on:` block has NO `pull_request:` — release runs on tag push only.
#   2. `Build artifacts` step injects FORGE_TWITCH_CLIENT_ID from repo secret
#      so the binary bakes in the Twitch client_id when the secret is set.
# Both deltas are documented in memory feedback_no_downgrade_fixes.
allow-dirty = ["ci"]
