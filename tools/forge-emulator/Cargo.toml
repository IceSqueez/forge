[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IceSqueez/forge"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[package]
name = "forge-emulator"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
forge-events = { path = "../../crates/forge-events" }
forge-overlay = { path = "../../crates/forge-overlay" }
forge-platform-core = { path = "../../crates/forge-platform-core" }
forge-platform-twitch = { path = "../../crates/forge-platform-twitch" }
forge-server = { path = "../../crates/forge-server" }
forge-storage = { path = "../../crates/forge-storage" }
forge-storage-sqlite = { path = "../../crates/forge-storage-sqlite" }
forge-types = { path = "../../crates/forge-types" }
axum = { version = "0.8" }
clap = { version = "4.6", features = ["derive"] }
directories = { version = "6.0" }
futures-util = { version = "0.3" }
rand = { version = "0.10" }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = { version = "2.0" }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.53", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
async-trait = { version = "0.1" }
axum = { version = "0.8", features = ["ws"] }
forge-registry = { path = "../../crates/forge-registry" }
tempfile = { version = "3.27" }
time = { version = "0.3", features = ["macros"] }
tokio = { version = "1.53", features = ["test-util"] }
