[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IceSqueez/forge"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[package]
name = "forge-emulator"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
forge-events = { path = "../../crates/forge-events" }
forge-types = { path = "../../crates/forge-types" }
clap = { version = "4.6", features = ["derive"] }
futures-util = { version = "0.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = { version = "2.0" }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30" }

[dev-dependencies]
time = { version = "0.3", features = ["macros"] }
