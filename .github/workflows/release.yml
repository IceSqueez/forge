name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build
    uses: ./.github/workflows/_build-matrix.yml
    secrets: inherit
    with:
      package_name: forge-desktop
      bin_name: forge
      retention_days: 1
      require_platform_client_ids: true
      release_build: true

  publish:
    name: Publish
    needs: [checks, build]
    runs-on: ubuntu-latest
    # The update signing key lives only in this environment (restricted to
    # v* tags); the build matrix never sees it.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: |
          for f in *; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done

      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          minisign -v

      - name: Generate update manifest
        run: |
          python3 .github/scripts/update-manifest.py \
            artifacts "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" artifacts/forge-update.json

      - name: Sign update manifest
        env:
          FORGE_UPDATE_SIGNING_KEY: ${{ secrets.FORGE_UPDATE_SIGNING_KEY }}
          FORGE_UPDATE_SIGNING_PASSWORD: ${{ secrets.FORGE_UPDATE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$FORGE_UPDATE_SIGNING_KEY" || -z "$FORGE_UPDATE_SIGNING_PASSWORD" ]]; then
            echo "::error::FORGE_UPDATE_SIGNING_KEY / FORGE_UPDATE_SIGNING_PASSWORD are empty - they must be set in the 'release' environment"
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/forge-update.key"
          trap 'rm -f "$KEY_FILE"' EXIT
          (umask 077 && printf '%s\n' "$FORGE_UPDATE_SIGNING_KEY" > "$KEY_FILE")
          printf '%s\n' "$FORGE_UPDATE_SIGNING_PASSWORD" | minisign -S \
            -s "$KEY_FILE" \
            -m artifacts/forge-update.json \
            -x artifacts/forge-update.json.minisig \
            -t "version:${GITHUB_REF_NAME#v}"

      - name: Verify update manifest signature against the shipped key
        run: |
          set -euo pipefail
          # Same key set the client compiles in; -H rejects the legacy
          # (non-prehashed) format the client refuses.
          mapfile -t KEYS < <(grep '^const PRODUCTION_KEYS' crates/forge-update/src/trust.rs | grep -o 'RW[A-Za-z0-9+/=]*')
          if [[ ${#KEYS[@]} -eq 0 ]]; then
            echo "::error::no public key found in crates/forge-update/src/trust.rs"
            exit 1
          fi
          verified=""
          for key in "${KEYS[@]}"; do
            if OUT=$(minisign -V -H -P "$key" -m artifacts/forge-update.json -x artifacts/forge-update.json.minisig); then
              verified="$OUT"
              break
            fi
          done
          if [[ -z "$verified" ]]; then
            echo "::error::forge-update.json.minisig does not verify against any key the client trusts"
            exit 1
          fi
          echo "$verified"
          expected="Trusted comment: version:${GITHUB_REF_NAME#v}"
          if ! grep -qxF "$expected" <<< "$verified"; then
            echo "::error::trusted comment does not carry the release version (expected '$expected')"
            exit 1
          fi

      - name: Resolve previous tag
        id: prev_tag
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            echo "range=$PREV.." >> $GITHUB_OUTPUT
          else
            echo "range=" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ steps.prev_tag.outputs.range }}HEAD --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Fallback changelog
        if: hashFiles('RELEASE_NOTES.md') == '' || steps.cliff.outcome == 'failure'
        run: |
          {
            echo "## What's Changed"
            echo ""
            git log ${{ steps.prev_tag.outputs.range }}HEAD --oneline --no-merges \
              | grep -v "^.*chore: Release" \
              | grep -v "^.*chore(release): " \
              | grep -v "^.*docs(changelog)" \
              | sed 's/^[a-f0-9]* /- /'
          } > RELEASE_NOTES.md

      - name: Append download table
        shell: bash
        run: |
          set -euo pipefail

          classify() {
            case "$1" in
              *macos-universal.dmg)  echo "macOS (Apple Silicon + Intel)" ;;
              *windows-x64.msi)      echo "Windows x64 (installer)" ;;
              *windows-x64.exe)      echo "Windows x64 (portable)" ;;
              *linux-x64.AppImage)   echo "Linux x64 (AppImage, portable)" ;;
              *linux-x64.deb)        echo "Linux x64 (Debian / Ubuntu)" ;;
              *linux-x64.rpm)        echo "Linux x64 (Fedora / RHEL / openSUSE)" ;;
              *)                     echo "" ;;
            esac
          }

          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"

          {
            echo ""
            echo "## Downloads"
            echo ""
            echo "| File | Platform | Checksum |"
            echo "| :--- | :--- | :--- |"
            # Fixed order: Linux (portable → deb → rpm) → macOS → Windows (installer → portable)
            for ext in AppImage deb rpm dmg msi exe; do
              for f in artifacts/*."$ext"; do
                [ -f "$f" ] || continue
                name="$(basename "$f")"
                platform="$(classify "$name")"
                [ -z "$platform" ] && continue
                echo "| [\`$name\`](https://github.com/$REPO/releases/download/$TAG/$name) | $platform | [checksum](https://github.com/$REPO/releases/download/$TAG/$name.sha256) |"
              done
            done
            echo ""
            echo "_Each binary ships with a matching \`<file>.sha256\` sidecar for offline verification._"
          } >> RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
